apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverso
  namespace: dry-run-001
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reverso
  template:
    metadata:
      labels:
        app: reverso
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: reverso
          image: poc-001-reverso:dry-run
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: poc-001-reverso-config
            - secretRef:
                name: poc-001-reverso-emisor
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
