<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dry Run 001</title>
<style>
  :root {
    --ink: #1c2430;
    --muted: #5e6874;
    --paper: #f3f1ec;
    --card: #ffffff;
    --line: #e3ddd4;
    --agent: #2457d6;
    --agent-bg: #f3f6ff;
    --skip: #8d8680;
    --skip-bg: #f7f6f4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  .sheet {
    width: min(1080px, calc(100% - 32px));
    margin: 28px auto 40px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 32px 24px;
  }
  .kicker {
    margin: 0 0 6px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--agent);
    font-weight: 650;
  }
  h1 { margin: 0 0 22px; font-size: 28px; letter-spacing: -0.02em; }
  .board {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }
  h2 { margin: 0 0 12px; font-size: 16px; }
  details.card {
    background: var(--agent-bg);
    border-left: 4px solid var(--agent);
    border-radius: 10px;
    margin: 0 0 10px;
  }
  details.card summary {
    cursor: pointer;
    padding: 10px 12px;
    font-weight: 650;
    list-style: none;
  }
  details.card summary::-webkit-details-marker { display: none; }
  details.card summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--agent); }
  details.card[open] summary::before { content: "▾"; }
  details.card .card-body { padding: 0 8px 8px; }
  .phase { display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
  .phase + .phase { margin-top: 14px; }
  .rail { display: flex; flex-direction: column; align-items: center; }
  .num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--line); color: var(--muted);
    font-size: 13px; font-weight: 650;
    display: grid; place-items: center;
  }
  .phase.current .num { background: var(--agent); color: #fff; }
  .phase.done .num { background: var(--ink); color: #fff; }
  .stem { flex: 1; width: 2px; background: var(--line); margin-top: 6px; min-height: 12px; }
  .phase:last-child .stem { display: none; }
  .phase h3 { margin: 4px 0 8px; font-size: 16px; }
  .phase.current h3 { color: var(--agent); }
  .result:empty { display: none; }
  .node {
    background: var(--agent-bg);
    border-left: 4px solid var(--agent);
    border-radius: 10px;
    padding: 8px 8px 6px;
    margin: 0 0 8px;
  }
  .node.note {
    background: var(--skip-bg);
    border-left: 4px solid var(--skip);
    color: var(--ink);
    padding: 10px 12px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  button.file, button.action {
    font: inherit;
    cursor: pointer;
  }
  button.file {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: transparent;
    color: var(--ink);
    padding: 6px 8px;
    border-radius: 6px;
  }
  button.file:hover, button.file[aria-current="true"] { background: #e4ebff; }
  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
  }
  button.action {
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 650;
  }
  #run { background: var(--agent); color: #fff; border: 0; }
  #run:hover:not(:disabled) { background: #1b46b3; }
  #run:disabled, #reset:disabled { opacity: 0.55; cursor: wait; }
  #reset { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  #reset:hover:not(:disabled) { background: var(--skip-bg); }
  #status { min-height: 1.45em; margin: 12px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
  #backdrop { position: fixed; inset: 0; background: rgba(28, 36, 48, .35); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 1; }
  #backdrop.open { opacity: 1; pointer-events: auto; }
  #drawer {
    position: fixed; top: 0; right: 0; z-index: 2;
    width: min(640px, 100%); height: 100%;
    background: #fff;
    box-shadow: -8px 0 28px rgba(28, 36, 48, .16);
    transform: translateX(100%);
    transition: transform .25s ease;
    display: flex; flex-direction: column;
  }
  #drawer.open { transform: translateX(0); }
  #drawer header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 16px 8px; }
  #drawer h2 { margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); word-break: break-all; }
  #close { width: auto; background: var(--skip-bg); border: 0; border-radius: 8px; padding: 8px 12px; font: inherit; font-weight: 650; cursor: pointer; }
  #view { flex: 1; overflow: auto; margin: 0; padding: 8px 16px 24px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.45; }
  @media (max-width: 800px) {
    .sheet { padding: 20px 16px; }
    .board { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="sheet">
  <p class="kicker">Dry Run</p>
  <h1>Dry Run 001</h1>
  <div class="board">
    <section>
      <h2>Inputs</h2>
      <div id="inputs"></div>
    </section>
    <section>
      <h2>Outputs</h2>
      <ol id="stages">
        <li class="phase" data-stage="0"><div class="rail"><div class="num">0</div><div class="stem"></div></div><div><h3>Setup</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="1"><div class="rail"><div class="num">1</div><div class="stem"></div></div><div><h3>Legacy</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="2"><div class="rail"><div class="num">2</div><div class="stem"></div></div><div><h3>As-Is</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="3"><div class="rail"><div class="num">3</div><div class="stem"></div></div><div><h3>Code</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="4"><div class="rail"><div class="num">4</div><div class="stem"></div></div><div><h3>Audit</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="5"><div class="rail"><div class="num">5</div><div class="stem"></div></div><div><h3>Spec</h3><div class="result"></div></div></li>
        <li class="phase" data-stage="6"><div class="rail"><div class="num">6</div><div class="stem"></div></div><div><h3>PoC</h3><div class="result"></div></div></li>
      </ol>
    </section>
  </div>
  <div class="actions">
    <button class="action" id="run" type="button">Ejecutar</button>
    <button class="action" id="reset" type="button">Reset</button>
  </div>
  <p id="status"></p>
</main>
<div id="backdrop"></div>
<script src="/web/railway-config.js"></script>
<aside id="drawer" aria-hidden="true">
  <header>
    <h2 id="path"></h2>
    <button id="close" type="button">Cerrar</button>
  </header>
  <pre id="view"></pre>
</aside>
<script>
const view = document.getElementById("view");
const pathEl = document.getElementById("path");
const statusEl = document.getElementById("status");
const runBtn = document.getElementById("run");
const resetBtn = document.getElementById("reset");
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
const inputLabels = { documentos: "Documentos", codigo: "Código legacy", contexto: "Contexto" };
const stages = [
  { id: "0", name: "Setup", files: (tree) => tree.outputs.contexto || [] },
  { id: "1", name: "Legacy", files: (tree) => (tree.outputs.conocimiento || []).filter((path) => path.includes("/01-legacy/")) },
  { id: "2", name: "As-Is", files: (tree) => (tree.outputs.conocimiento || []).filter((path) => path.includes("/02-asis/")) },
  { id: "3", name: "Code", files: (tree) => (tree.outputs.conocimiento || []).filter((path) => path.includes("/03-code/")) },
  { id: "4", name: "Audit", files: (tree) => tree.outputs.auditoria || [] },
  { id: "5", name: "Spec", files: (tree) => tree.outputs.spec || [] },
  { id: "6", name: "PoC", files: (tree) => (tree.outputs.poc || []).concat(tree.outputs.estado || []) },
];
let treeCache = null;

function wait(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function usesLocalApi() {
  return (location.hostname === "127.0.0.1" || location.hostname === "localhost") && location.port === "8766";
}

function absoluteUrl(value) {
  const raw = String(value || "").trim().replace(/\/$/, "");
  if (!raw) return "";
  if (/^https?:\/\//i.test(raw)) return raw;
  return "https://" + raw.replace(/^\/+/, "");
}

function railwayBases() {
  const cfg = window.RAILWAY || {};
  return { reverso: absoluteUrl(cfg.reversoUrl), emisor: absoluteUrl(cfg.emisorUrl) };
}

function fileButton(path) {
  const button = document.createElement("button");
  button.type = "button";
  button.className = "file";
  button.textContent = path.split("/").slice(-2).join("/");
  button.title = path;
  button.onclick = () => openFile(path, button);
  return button;
}

function group(title, paths) {
  const card = document.createElement("details");
  card.className = "card";
  card.open = true;
  const summary = document.createElement("summary");
  summary.textContent = title;
  card.append(summary);
  const body = document.createElement("div");
  body.className = "card-body";
  if (!paths.length) {
    const empty = document.createElement("p");
    empty.textContent = "Vacío.";
    body.append(empty);
  } else {
    for (const path of paths) body.append(fileButton(path));
  }
  card.append(body);
  return card;
}

function paintInputs(tree) {
  const inputs = document.getElementById("inputs");
  inputs.replaceChildren();
  for (const [key, paths] of Object.entries(tree.inputs)) inputs.append(group(inputLabels[key], paths));
}

function stageNode(id) {
  return document.querySelector('.phase[data-stage="' + id + '"]');
}

function clearOutputs() {
  for (const stage of stages) {
    const node = stageNode(stage.id);
    node.classList.remove("current", "done");
    node.querySelector(".result").replaceChildren();
  }
  statusEl.textContent = "";
}

function showStageFiles(stage, paths) {
  const result = stageNode(stage.id).querySelector(".result");
  const box = document.createElement("div");
  box.className = "node";
  if (!paths.length) {
    const empty = document.createElement("p");
    empty.textContent = "Sin archivos.";
    box.append(empty);
  } else {
    for (const path of paths) box.append(fileButton(path));
  }
  result.append(box);
  result.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function showStageNote(id, text) {
  const note = document.createElement("pre");
  note.className = "node note";
  note.textContent = text;
  stageNode(id).querySelector(".result").append(note);
}

function openDrawer() {
  drawer.classList.add("open");
  backdrop.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
}

function closeDrawer() {
  drawer.classList.remove("open");
  backdrop.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
}

async function openFile(path, button) {
  document.querySelectorAll(".file").forEach((node) => node.removeAttribute("aria-current"));
  if (button) button.setAttribute("aria-current", "true");
  pathEl.textContent = path;
  view.textContent = "Cargando…";
  openDrawer();
  if (usesLocalApi()) {
    const response = await fetch("/api/file?path=" + encodeURIComponent(path));
    const payload = await response.json();
    view.textContent = payload.text || payload.error || "";
    return;
  }
  const response = await fetch("/" + path.split("/").map(encodeURIComponent).join("/"));
  view.textContent = response.ok ? await response.text() : "No se pudo leer " + path + " (" + response.status + ").";
}

async function callRailway() {
  const { reverso, emisor } = railwayBases();
  if (!reverso || !emisor) throw new Error("Faltan RAILWAY_REVERSO_URL y RAILWAY_EMISOR_URL.");
  const lines = [];
  const healthReverso = await fetch(reverso + "/health");
  lines.push("GET " + reverso + "/health → " + healthReverso.status + " " + (await healthReverso.text()));
  const healthEmisor = await fetch(emisor + "/health");
  lines.push("GET " + emisor + "/health → " + healthEmisor.status + " " + (await healthEmisor.text()));
  const decision = await fetch(reverso + "/v1/autorizaciones", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ emisor_id: "A", respondio: false, transcurrido_s: 20 }),
  });
  lines.push("POST " + reverso + "/v1/autorizaciones → " + decision.status + " " + (await decision.text()));
  const ok = healthReverso.status === 200 && healthEmisor.status === 200 && decision.status === 200;
  if (!ok) throw new Error(lines.join("\n"));
  return lines.join("\n");
}

async function play(tree) {
  clearOutputs();
  for (const stage of stages) {
    for (const other of stages) stageNode(other.id).classList.remove("current");
    stageNode(stage.id).classList.add("current");
    statusEl.textContent = "Etapa " + stage.id + " · " + stage.name;
    let note = "";
    if (stage.id === "6" && !usesLocalApi()) note = await callRailway();
    else await wait(420);
    showStageFiles(stage, stage.files(tree));
    if (note) showStageNote(stage.id, note);
    stageNode(stage.id).classList.remove("current");
    stageNode(stage.id).classList.add("done");
  }
  statusEl.textContent = "Listo.";
}

async function loadTree() {
  if (usesLocalApi()) return (await fetch("/api/tree")).json();
  return (await fetch("/web/tree.json")).json();
}

async function load() {
  treeCache = await loadTree();
  paintInputs(treeCache);
}

runBtn.onclick = async () => {
  runBtn.disabled = true;
  resetBtn.disabled = true;
  try {
    if (usesLocalApi()) {
      statusEl.textContent = "Etapa 0 · Setup";
      stageNode("0").classList.add("current");
      const response = await fetch("/api/run", { method: "POST" });
      const payload = await response.json();
      if (payload.exit_code !== 0) {
        throw new Error(payload.stderr || payload.error || "La corrida falló.");
      }
      treeCache = await loadTree();
    }
    await play(treeCache);
  } catch (error) {
    statusEl.textContent = String(error.message || error);
  } finally {
    runBtn.disabled = false;
    resetBtn.disabled = false;
  }
};

resetBtn.onclick = () => {
  if (runBtn.disabled) return;
  clearOutputs();
};

document.getElementById("close").onclick = closeDrawer;
backdrop.onclick = closeDrawer;
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeDrawer();
});

load();
</script>
</body>
</html>
